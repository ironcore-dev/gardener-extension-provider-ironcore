# The OCM v2 CLI does not read the Docker config on its own; resolve registry
# credentials (e.g. from docker/login-action) through it explicitly.
type: generic.config.ocm.software/v1
configurations:
  - type: credentials.config.ocm.software
    repositories:
      - repository:
          type: DockerConfig/v1
          dockerConfigFile: "~/.docker/config.json"
