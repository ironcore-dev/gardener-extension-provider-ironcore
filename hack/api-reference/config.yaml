      link: https://pkg.go.dev/k8s.io/component-base/config/v1alpha1#ClientConnectionConfiguration
    - name: HealthCheckConfig
      package: github.com/gardener/gardener/extensions/pkg/apis/config/v1alpha1
      link: https://pkg.go.dev/github.com/gardener/gardener/extensions/pkg/apis/config/v1alpha1#HealthCheckConfig
